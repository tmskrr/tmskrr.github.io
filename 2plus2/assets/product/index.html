<!doctype html>
<html lang="en" class="theme-auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A fast, accessible converter for binary, octal, decimal, hexadecimal, and text values." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="number systems converter" />
    <meta property="og:description" content="Convert binary, octal, decimal, hexadecimal, and text values with calculation steps." />
    <link rel="canonical" href="https://converteron.converteron.workers.dev/" />
    <meta property="og:url" content="https://converteron.converteron.workers.dev/" />
    <title>number systems converter</title>
    <link rel="icon" href="./images/logo-favicon.svg?v=71eca9a71049" type="image/svg+xml" />
    <link rel="stylesheet" href="./fonts/fonts.css?v=71eca9a71049" />
    <link rel="stylesheet" href="./styles/globals.css?v=71eca9a71049" />
    <link rel="stylesheet" href="./styles/style.css?v=71eca9a71049" />
    <link rel="stylesheet" href="./styles/theme-light.css?v=71eca9a71049" />
    <link rel="stylesheet" href="./styles/theme-dark.css?v=71eca9a71049" />
  </head>
  <body class="page">
    <header class="header">
      <a class="header__logo" id="home-link" href="./" aria-label="number systems converter home"><img class="header__logo-image" src="./images/logo-dark.svg?v=71eca9a71049" alt="2 + 2" width="140" height="50" /></a>
      <div class="header__status" aria-live="off">
        <div class="clock"><time class="clock__time" id="local-time"><span class="visually-hidden" id="local-time-text"></span><span class="clock__visual" id="clock-visual" aria-hidden="true"></span></time><span class="clock__date" id="local-date"></span><span class="clock__zone" id="local-zone"></span></div>
      </div>
      <div class="header__utilities">
        <nav class="header__theme-menu" id="theme-menu" aria-label="color theme">
          <button type="button" class="theme-toggle" id="theme-toggle" data-theme-mode="auto" aria-label="automatic theme"><span class="theme-toggle__icon theme-toggle__icon--light" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"></path></svg></span><span class="theme-toggle__icon theme-toggle__icon--dark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M20 15.2A8.2 8.2 0 0 1 8.8 4a8.2 8.2 0 1 0 11.2 11.2Z"></path></svg></span><span class="theme-toggle__icon theme-toggle__icon--auto" aria-hidden="true">A</span></button>
        </nav>
        <nav class="header__language-menu" id="language-menu" aria-label="interface language">
          <button type="button" class="utility-button language-button" data-language="ru">ру</button><button type="button" class="utility-button language-button" data-language="en">en</button>
        </nav>
      </div>
    </header>
    <main class="app">
      <form class="converter" id="converter-form" novalidate>
        <div class="converter__row">
          <label class="converter__text" id="from-label" for="from-base-trigger">from</label><span aria-hidden="true"></span><label class="converter__text" id="to-label" for="to-base-trigger">to</label>
          <div class="converter__select-wrapper" data-dropdown><select id="from-base" class="converter__native-select" hidden aria-hidden="true"><option value="2">binary</option><option value="10">decimal</option><option value="8">octal</option><option value="16">hexadecimal</option><option value="text">text</option></select><button class="converter__select-control dropdown__trigger" id="from-base-trigger" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="from-base-listbox" aria-labelledby="from-label from-base-trigger"><span id="from-base-value" class="dropdown__value"></span></button><div class="dropdown__menu" id="from-base-listbox" role="listbox" aria-labelledby="from-label"></div></div>
          <button class="swap-btn" id="swap-top-btn" type="button" aria-label="swap number systems"></button>
          <div class="converter__select-wrapper" data-dropdown><select id="to-base" class="converter__native-select" hidden aria-hidden="true"><option value="10">decimal</option><option value="8">octal</option><option value="16">hexadecimal</option><option value="text">text</option></select><button class="converter__select-control dropdown__trigger" id="to-base-trigger" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="to-base-listbox" aria-labelledby="to-label to-base-trigger"><span id="to-base-value" class="dropdown__value"></span></button><div class="dropdown__menu" id="to-base-listbox" role="listbox" aria-labelledby="to-label"></div></div>
        </div>
        <div class="converter__block">
          <label class="converter__text" id="input-label" for="number-input">enter binary number</label>
          <div class="converter__input" id="input-wrapper"><input id="number-input" class="converter__field converter__input-block" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" maxlength="4096" placeholder="101010" aria-describedby="input-helper input-error" /><span class="converter__base" id="input-base"><span class="converter__base-value">2</span></span></div>
          <p class="converter__helper" id="input-helper" hidden></p>
          <p class="converter__error" id="input-error" role="alert" aria-live="polite" aria-atomic="true"></p>
          <div class="converter__actions">
            <button class="converter__actions-button button__reset" id="reset-btn" type="button"><img src="./images/cross-gark.svg?v=71eca9a71049" alt="" aria-hidden="true" />RESET</button>
            <button class="converter__actions-button button__convert" id="convert-btn" type="submit"><img src="./images/equals-light.svg?v=71eca9a71049" alt="" aria-hidden="true" />CONVERT</button>
          </div>
        </div>
        <section class="results" id="results" aria-label="conversion results" aria-live="polite">
          <div class="converter__block" id="formula-block" hidden><p class="converter__text" id="formula-label">result in the decimal system</p><div class="converter__field converter__result-shell converter__formula-shell"><div class="converter__result" id="result-formula"><span class="converter__result-text"></span></div><button type="button" class="icon-btn" data-copy="result-formula" aria-label="copy result" disabled><span class="copy-icon" aria-hidden="true"></span></button></div></div>
          <div class="converter__outputs" id="output-blocks"></div>
          <label class="converter__option"><input id="digit-grouping" type="checkbox" /><span class="checkbox-ui" aria-hidden="true"></span><span class="converter__text">group digits</span></label>
          <div class="converter__block"><p class="converter__text" id="steps-label">decimal calculation steps</p><div class="converter__steps-wrapper"><div class="converter__field converter__result-steps" id="result-steps"></div><button type="button" class="icon-btn icon-btn--steps" data-copy="result-steps" aria-label="copy calculation steps" disabled><span class="copy-icon" aria-hidden="true"></span></button></div></div>
          <section class="converter__endian" id="endian-block" aria-label="byte order" hidden>
            <div class="converter__block converter__endian-card" id="little-endian-block"><p class="converter__text" id="little-endian-label">little endian</p><dl class="converter__endian-table"><div class="converter__endian-row"><dt id="little-address-label">address</dt><dd id="little-endian-address"></dd></div><div class="converter__endian-row"><dt id="little-data-label">data</dt><dd class="converter__field converter__result-shell" id="little-endian-data"><span class="converter__result-text"></span><button type="button" class="icon-btn" data-copy="little-endian-data" aria-label="copy little endian data" disabled><span class="copy-icon" aria-hidden="true"></span></button></dd></div></dl></div>
            <div class="converter__block converter__endian-card" id="big-endian-block"><p class="converter__text" id="big-endian-label">big endian</p><dl class="converter__endian-table"><div class="converter__endian-row"><dt id="big-address-label">address</dt><dd id="big-endian-address"></dd></div><div class="converter__endian-row"><dt id="big-data-label">data</dt><dd class="converter__field converter__result-shell" id="big-endian-data"><span class="converter__result-text"></span><button type="button" class="icon-btn" data-copy="big-endian-data" aria-label="copy big endian data" disabled><span class="copy-icon" aria-hidden="true"></span></button></dd></div></dl></div>
          </section>
        </section>
      </form>
    </main>
    <footer class="footer" aria-label="service information">
      <a class="footer__link" id="about-link" href="./about.html">about</a><span class="footer__separator" aria-hidden="true">/</span>
      <a class="footer__link" id="privacy-link" href="./privacy.html">privacy</a><span class="footer__separator" aria-hidden="true">/</span>
      <a class="footer__link" id="bot-link" href="https://t.me/twoplus2_feedback_bot">tg-bot</a>
    </footer>
    <script type="module" src="./js/main.js?v=71eca9a71049"></script>
  </body>
</html>
